apiVersion: v1
kind: Namespace
metadata:
  name: commerce
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: commerce
spec:
  template:
    spec:
      serviceAccountName: payments-api
      containers:
        - name: app
          image: ghcr.io/acme/payments-api:1.2.3
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: commerce
spec:
  ports:
    - port: 80
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: commerce
